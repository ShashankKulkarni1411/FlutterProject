name: finance_app
description: "A comprehensive finance and expense management Flutter app."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Core Flutter Packages
  cupertino_icons: ^1.0.8
  intl: ^0.19.0

  # State Management
  get: ^4.6.6

  # Firebase Packages
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4

  # Charts and Data Visualization
  fl_chart: ^0.65.0

  # Local Storage
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
